<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password — OpenSurgery</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/assets/js/script.js" defer></script>
  </head>
  <body class="auth-body">
    <header class="site-header auth-header">
      <span></span
      ><a class="wordmark" href="home.html"
        ><span class="wordmark__symbol">O</span><span><strong>OpenSurgery</strong></span></a
      >
    </header>
    <main class="auth-shell auth-shell--single">
      <section class="auth-card">
        <span class="auth-kicker">Account recovery</span>
        <h1>Reset your password</h1>
        <p>
          Enter your account email and we’ll send you a secure link to choose a new password.
        </p>
        <form class="auth-form" data-demo-form="reset">
          <label>Email<input type="email" name="email" autocomplete="email" required /></label
          ><button class="primary-button" type="submit">Send reset link</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
        <div class="auth-switch"><a href="login.html">← Return to login</a></div>
      </section>
    </main>
  </body>
</html>
