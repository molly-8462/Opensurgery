<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Choose a new password — OpenSurgery</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/assets/js/script.js" defer></script>
  </head>
  <body class="auth-body">
    <header class="site-header auth-header">
      <span></span><a class="wordmark" href="home.html"><span class="wordmark__symbol">O</span><span><strong>OpenSurgery</strong></span></a>
    </header>
    <main class="auth-shell auth-shell--single">
      <section class="auth-card">
        <span class="auth-kicker">Account recovery</span>
        <h1>Choose a new password</h1>
        <p>Use at least 8 characters. After this change, you’ll need to sign in again on your devices.</p>
        <form class="auth-form" data-password-reset-confirm>
          <label>New password<input type="password" name="password" autocomplete="new-password" required /></label>
          <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" required /></label>
          <button class="primary-button" type="submit">Update password</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
        <div class="auth-switch"><a href="login.html">← Return to login</a></div>
      </section>
    </main>
  </body>
</html>
