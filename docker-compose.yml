services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opensurgery
      POSTGRES_USER: opensurgery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensurgery}
    ports:
      - "5432:5432"
    volumes:
      - opensurgery_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensurgery -d opensurgery"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      SITE_NAME: ${SITE_NAME:-OpenSurgery}
      DATABASE_URL: postgresql+psycopg://opensurgery:${POSTGRES_PASSWORD:-opensurgery}@db:5432/opensurgery
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MEDIA_ROOT: /data/media
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - opensurgery_media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  opensurgery_postgres:
  opensurgery_media:
