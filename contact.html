<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — OpenSurgery</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span></button
      ><a class="wordmark" href="home.html"
        ><span class="wordmark__symbol">O</span><span><strong>OpenSurgery</strong></span></a
      ><span></span>
      <nav class="account-links"><a href="login.html">Log in</a></nav>
    </header>
    <main class="contact-shell">
      <header>
        <span>Contact</span>
        <h1>How can we help?</h1>
        <p>
          This prototype demonstrates routing and confirmation states; it does not send messages
          externally.
        </p>
      </header>
      <div class="contact-layout">
        <nav>
          <button class="is-active" type="button">General question</button
          ><button type="button">Report a safety issue</button
          ><button type="button">Surgeon correction</button
          ><button type="button">Privacy request</button>
        </nav>
        <form data-demo-form="contact">
          <label
            >Topic<select>
              <option>General question</option>
              <option>Safety issue</option>
              <option>Surgeon correction</option>
              <option>Privacy request</option>
            </select></label
          ><label>Email<input type="email" required /></label
          ><label>Subject<input type="text" required /></label
          ><label>Message<textarea rows="8" required></textarea></label>
          <p>
            Do not use this form for urgent medical concerns. Contact a qualified local service.
          </p>
          <button class="primary-button">Send message</button>
          <p class="form-status" role="status"></p>
        </form>
      </div>
    </main>
  </body>
</html>
